<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <div class="brand">🎓 Student Management System</div>
        <button class="nav-toggle" type="button">☰ Menu</button>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="students.html">Students</a>
            <a href="courses.html">Courses</a>
            <a href="attendance.html">Attendance</a>
            <a href="records.html">Records</a>
            <a href="reports.html">Reports</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="page-title">Course Management</h1>
    <p class="muted">Add, search, and manage courses offered by the institution.</p>

    <section class="card">
        <h2 id="course-form-title">Add a Course</h2>

        <form id="course-form">
            <input type="hidden" id="course-id">

            <label for="course-name">Course Name</label>
            <input id="course-name" type="text"
                   placeholder="e.g. Computer Science" required>

            <label for="course-code">Course Code</label>
            <input id="course-code" type="text"
                   placeholder="e.g. CS101" required>

            <label for="course-duration">Duration</label>
            <select id="course-duration" required>
                <option value="">Select duration</option>
                <option>3 Months</option>
                <option>6 Months</option>
                <option>1 Year</option>
                <option>2 Years</option>
                <option>3 Years</option>
                <option>4 Years</option>
            </select>

            <div class="btn-row">
                <button type="submit" class="btn">Save Course</button>
                <button type="reset" class="btn secondary">Clear Form</button>
            </div>
        </form>
        <p id="course-message" class="muted" aria-live="polite"></p>
    </section>

    <section class="card" style="margin-top:24px;">
        <h2>Available Courses</h2>

        <label for="course-search">Search Courses</label>
        <input id="course-search" type="search"
               placeholder="Search by course name or code">

        <div class="table-wrap">
            <table class="responsive-table">
                <thead>
                    <tr>
                        <th>Course Name</th>
                        <th>Course Code</th>
                        <th>Duration</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="course-list"></tbody>
            </table>
        </div>
    </section>
</main>

</body>
</html>
